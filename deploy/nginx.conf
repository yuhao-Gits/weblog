# ============================================================
# Weblog 前端 Nginx 配置
# 作用：托管 Vue 静态资源，并将 /api、/files 反向代理到后端
# ============================================================

server {
    listen       80;
    server_name  _;

    # 前端静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 开启 gzip 压缩，减小传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理（后端容器名 backend，走 Compose 内部网络）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件静态资源反代
    location /files/ {
        proxy_pass http://backend:8080/files/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Vue Router history 模式：前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端健康检查（Actuator）透传
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
