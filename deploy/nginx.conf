# ============================================================
# Weblog 前端 Nginx 配置（单入口网关）
# 作用：托管 Vue 静态资源，并将 /api、/files、/minio 反向代理到后端/Minio。
# 反代目标均为 Compose 内网服务名：backend / minio。
# ============================================================

server {
    listen       80;
    server_name  _;

    # 前端静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 上传/请求体大小上限（与后端 multipart 10MB 对齐，留 2MB 余量）
    client_max_body_size 12m;

    # 开启 gzip 压缩，减小传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- WebSocket 聊天室（需放在 /api/ 之前，最长前缀优先命中） ----------
    location /api/chat/ws {
        proxy_pass http://backend:8080/chat/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- REST API 反向代理（去掉 /api 前缀） ----------
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- 图片/附件对象（直连 Minio，匿名可读，不经后端） ----------
    # bucket「weblog」已设匿名下载策略；/files/<obj> -> minio:9000/weblog/<obj>
    # 若 storage.type=local 兜底模式，请将下一行替换为：proxy_pass http://backend:8080/files/;
    location /files/ {
        proxy_pass http://minio:9000/weblog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- Minio Console（best-effort 子路径反代） ----------
    # 说明：Console 为根路径 SPA，子路径 /minio/ 下静态资源可能错乱，
    # 推荐后台直接访问 http://IP:9001；此处仅作尽力而为。
    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ---------- 后端健康检查（Actuator）透传 ----------
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # ---------- Vue Router history 模式：前端路由回退到 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
