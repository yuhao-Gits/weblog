# ============================================================
# 生产环境配置（激活方式：--spring.profiles.active=prod）
# 说明：
#   - 数据源切 MySQL；敏感信息（用户名/密码/JWT/Minio 凭据）必须通过环境变量注入，禁止硬编码。
#   - 文件存储默认切 Minio（weblog.storage.type=minio），桶/凭据由 deploy/.env 注入。
#   - sql.init.mode 由环境变量控制，compose 中设为 always 以幂等建表（IF NOT EXISTS / INSERT IGNORE）。
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/weblog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      # 生产默认不自动执行脚本；compose 首启通过 SPRING_SQL_INIT_MODE=always 开启幂等初始化
      mode: ${SPRING_SQL_INIT_MODE:never}

weblog:
  jwt:
    secret: ${WEBLOG_JWT_SECRET}
  # 文件存储：生产默认对象存储 Minio
  storage:
    type: ${WEBLOG_STORAGE_TYPE:minio}
  # Minio 连接（与 deploy/.env 的 MINIO_ROOT_USER/PASSWORD/BUCKET 对齐）
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:weblog}
  upload:
    # 本地兜底目录（仅 storage.type=local 时使用）
    path: ${WEBLOG_UPLOAD_PATH:/data/weblog/uploads}
    # 对外访问前缀，本地/Minio 统一保持 /files，前端无感知
    url-prefix: /files

mybatis-plus:
  configuration:
    # 生产关闭 SQL 日志，减少噪声与开销
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
