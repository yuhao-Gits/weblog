# ============================================================
# Weblog CI/CD 流水线
# 触发：push 到 main / 提交 PR
# 阶段：后端构建测试 → 前端构建 lint → （可选）Docker 镜像构建
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- 后端：编译 + 单元测试 ----------
  backend:
    name: Backend (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: 编译
        run: mvn -B clean package -DskipTests
        working-directory: weblog-server

      - name: 单元测试
        run: mvn -B test
        working-directory: weblog-server

      # 测试报告归档（失败时便于排查）
      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: weblog-server/target/surefire-reports/
          retention-days: 7

  # ---------- 前端：依赖安装 + lint + 构建 ----------
  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: weblog-web/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: weblog-web

      - name: 代码规范检查
        run: npm run lint
        working-directory: weblog-web

      - name: 构建
        run: npm run build
        working-directory: weblog-web

  # ---------- Docker 镜像构建（可选，仅验证可构建） ----------
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t weblog-server:ci .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t weblog-web:ci .
